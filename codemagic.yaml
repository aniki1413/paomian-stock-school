# 泡麵家親子股海 — Codemagic
# 免費方案請用 mac_mini_m2。簽章用 Codemagic 介面上的整合，名稱必須是 codemagic_asc。
# 這個檔案沒有任何 API 金鑰或 .p8。

workflows:
  ios-testflight:
    name: iOS TestFlight（泡麵家親子股海）
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic_asc
    environment:
      # Apple 發佈憑證的私鑰。只放在 Codemagic 的加密變數群組，不要寫進這個檔案。
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.aniki1413.paomianstock
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the static web app
        script: npm run build:native
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create the App Store certificate and profile
        script: |
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "缺少加密變數 CERTIFICATE_PRIVATE_KEY（群組 code-signing）。請看 CODEMAGIC_SETUP.md。"
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add the certificate to the keychain
        script: keychain add-certificates
      - name: Apply the provisioning profile
        script: xcode-project use-profiles
      - name: Increment build number from the latest TestFlight build
        script: bash scripts/codemagic-ios-build-number.sh
      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # 除錯用 Android 套件。debug 簽章，不能上傳 Google Play。
  android-debug-aab:
    name: Android 除錯 AAB（debug 簽章，不能上架）
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the static web app
        script: npm run build:native
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build a debug Android App Bundle
        script: |
          cd android
          ./gradlew bundleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/debug/*.aab
